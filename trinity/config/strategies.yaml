# TRINITY 3.0 — Aggressive Growth Edition: strategy, capital and risk configuration.
# All monetary values are in USD (internal settlement currency).
# Changing these values changes REAL risk once live trading is enabled. Read RISK_POLICY.md.
#
# The 30% monthly figure is an informational ASPIRATION only. It is never used to open
# trades, size positions or relax limits. No return is guaranteed.

# The ONLY approved risk profile (SPEC_4.0.md A4). The values in "risk" and "quality" must match it
# exactly, otherwise the configuration does not load. Per-bot quality thresholds may only be raised.
profile: BALANCED

quality:
  min_score: 70                     # Trade Quality Score 0..100; entries below the threshold are rejected
  per_bot:
    crypto_momentum: 70
    stock_trend: 70

emergency:
  default_stop_pct: 0.03            # emergency stop for positions that have none: last price - 3%
  guardian_interval_seconds: 15     # Position Guardian check interval (always active)

capital:
  total_capital_usd: 500            # initial contributed capital (recorded as the first deposit)
  allocations:                      # INITIAL allocation. Later changes only via approved reallocation.
    crypto_momentum: 150
    stock_trend: 100
    arbitrage: 0                    # scan + paper only
  reserve_usd: 250                  # never used automatically
  reinvest_profits: true            # 100% reinvestment: realized profits grow the strategy's capital
  monthly_contribution_usd: 200     # expected deposit; every deposit goes to the RESERVE first
  informational_monthly_target_pct: 0.30   # display only, never a trading input
  max_strategy_allocation_pct: 0.45 # one strategy may not hold more than 45% of contributed capital

risk:
  max_risk_per_trade_pct: 0.0075    # 0.75% of current account equity (risk to stop)
  max_total_open_risk_pct: 0.03     # sum of risk-to-stop of all open positions + pending entries
  max_daily_loss_pct: 0.03          # vs equity at the start of the UTC day (deposit-adjusted)
  max_weekly_loss_pct: 0.06         # vs equity at the start of the ISO week (deposit-adjusted)
  drawdown_warning_pct: 0.10        # notify
  drawdown_reduce_pct: 0.12         # reduced activity: risk per trade and open risk x multiplier
  drawdown_live_lock_pct: 0.15      # block new positions, cancel orders, manual confirmation
  drawdown_emergency_pct: 0.20      # absolute limit: hard stop (only protective exits allowed)
  reduced_activity_multiplier: 0.5
  max_total_exposure_pct: 0.60      # of equity, positions + pending entries (notional)
  max_order_notional_usd: 120
  min_order_notional_usd: 5
  max_position_pct_of_strategy: 0.60
  max_open_positions: 5
  max_open_orders: 30
  max_correlated_exposure_pct: 0.35 # per static correlation group, of equity
  correlation_threshold: 0.80       # dynamic return correlation: max one risky position per cluster
  correlation_lookback_bars: 120
  max_price_age_seconds:
    crypto: 30
    stock: 180
  api_failure_threshold: 5
  api_cooldown_seconds: 120
  max_orders_per_minute: 20

leverage:
  # Default OFF. Spot only. Never used in the initial phase of real trading.
  # Permission requires LIVE_LEVERAGE_ENABLED=true + acknowledgement + >= 60 days of successful
  # live trading WITHOUT leverage + full test suite + local approval (scripts/leverage.py).
  enabled: false
  margin_mode: isolated
  max_leverage: 1.5                 # initial limit; the code hard cap is 2.0 and is never exceeded
  symbols: [BTC/USDT, ETH/USDT]
  venue: crypto_perp
  maintenance_margin_rate: 0.005    # ESTIMATE; real value is read from the exchange when available
  min_stop_to_liquidation_buffer_pct: 0.5   # stop must be at least 50% of the entry->liq distance away from liq
  max_funding_rate_8h: 0.0005       # skip leveraged longs when funding exceeds 0.05% per 8h
  required_live_days_without_leverage: 60

paper:
  min_days: 30
  min_closed_trades: 100
  require_paper_validation: true
  initial_balances:
    paper_crypto:
      USDT: 150
    paper_stocks:
      USD: 100
  simulation:
    taker_slippage_bps: 5
    limit_fill_ratio: 0.5
    stock_spread_bps: 2
    seed: 42

strategies:
  crypto_momentum:
    enabled: true
    strategy_id: crypto_momentum
    venue: crypto
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
    timeframe: 1h
    history_bars: 400
    loop_interval_seconds: 60
    indicators:
      ema_fast: 20
      ema_mid: 50
      ema_slow: 200
      rsi_period: 14
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      atr_period: 14
      volume_lookback: 20
      min_atr_pct: 0.004            # volatility filter: too quiet -> no trade
      max_atr_pct: 0.05             # volatility filter: too wild -> no trade
    momentum:
      enabled: true
      rsi_min: 52
      rsi_max: 72
      min_volume_ratio: 1.1
      stop_atr_multiplier: 2.0
      take_profit_r: 3.0
      trailing_atr_multiplier: 2.5
      trailing_activation_r: 1.0
    breakout:
      enabled: true
      lookback_bars: 20
      min_volume_ratio: 1.5
      min_close_position_in_range: 0.6   # breakout bar must close in the upper 40% of its range
      confirmation_bars: 1               # bars that must close above the level after the breakout bar
      max_extension_atr: 1.5             # skip if price already ran too far above the level
      stop_atr_below_level: 1.0
      take_profit_r: 2.5
      trailing_atr_multiplier: 2.5
      trailing_activation_r: 1.0
    entry_limit_offset_bps: 10
    max_spread_bps: 15
    cooldown_bars_after_exit: 3

  stock_trend:
    enabled: true
    strategy_id: stock_trend
    venue: stocks
    symbols: [SPY, QQQ, VTI]
    timeframe: 1Day
    history_bars: 260
    loop_interval_seconds: 60
    ema_fast: 20
    ema_slow: 50
    rsi_period: 14
    rsi_min: 45
    rsi_max: 70
    atr_period: 14
    volume_lookback: 20
    min_up_down_volume_ratio: 1.0
    min_avg_dollar_volume: 50000000
    stop_atr_multiplier: 2.0
    take_profit_r: 2.5
    trailing_atr_multiplier: 3.0
    trailing_activation_r: 1.0
    min_reward_risk: 1.5
    max_positions: 2
    entry_limit_offset_bps: 10
    max_spread_bps: 20
    allow_fractional: true
    breakout:
      enabled: true
      lookback_bars: 55
      min_volume_ratio: 1.3
      stop_atr_below_level: 1.0
      take_profit_r: 2.5
      max_extension_atr: 1.0

  arbitrage:
    enabled: true
    strategy_id: arbitrage
    mode: scan_only
    exchanges: []
    symbols: [BTC/USDT, ETH/USDT]
    loop_interval_seconds: 10
    trade_size_usd: 100
    orderbook_depth: 20
    min_net_profit_usd: 0.10
    min_net_profit_bps: 5
    slippage_bps: 5
    max_quote_age_ms: 3000
    max_clock_skew_ms: 2000
    max_fetch_latency_ms: 1500      # data-delay control: slower snapshots are not trusted
    assumed_latency_ms: 500
    max_execution_risk_usd: 0.50
    volatility_per_second_bps: 2.0
    transfer_amortization_trades: 10
    transfer_fees:
      BTC: 0.0002
      ETH: 0.002
      USDT: 1.0
    taker_fees:
      default: 0.001
    # VIRTUAL inventory only: split per exchange into USDT + each base asset.
    virtual_capital_usd: 1800
